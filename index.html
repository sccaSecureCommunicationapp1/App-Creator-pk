<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio & APK Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Side Controls Panel */
        .sidebar {
            width: 350px;
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid #334155;
        }

        .sidebar h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            resize: none;
            font-size: 0.9rem;
        }

        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button.voice-btn {
            background-color: #9333ea;
        }

        button.voice-btn:hover {
            background-color: #7e22ce;
        }

        button.apk-btn {
            background-color: #16a34a;
        }

        button.apk-btn:hover {
            background-color: #15803d;
        }

        /* Main View Panel (View Bar / Console Output) */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #020617;
        }

        .header {
            background-color: #0f172a;
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background-color: #1e293b;
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid #22c55e;
        }

        .view-bar {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #38bdf8;
        }

        .log-entry {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
        }

        .log-success { border-left-color: #22c55e; color: #4ade80; }
        .log-warning { border-left-color: #eab308; color: #fde047; }
        .log-info { border-left-color: #38bdf8; color: #7dd3fc; }
    </style>
</head>
<body>

    <!-- Left Control Panel -->
    <div class="sidebar">
        <h2>King of AI Control Panel</h2>
        <label for="prompt">Command / Prompt Input:</label>
        <textarea id="prompt" placeholder="انٹر کریں کہ آپ کس قسم کی ایپ یا فائل بنانا چاہتے ہیں..."></textarea>
        
        <div class="btn-group">
            <button id="btn-generate-code">
                💻 Generate Code
            </button>
            <button id="btn-generate-voice" class="voice-btn">
                🎙️ Generate Voice File
            </button>
            <button id="btn-build-apk" class="apk-btn">
                📦 Build & Generate APK
            </button>
        </div>
    </div>

    <!-- Right Live View Bar Panel -->
    <div class="main-content">
        <div class="header">
            <h3>Live Output & View Bar</h3>
            <span class="status-badge" id="system-status">System Ready</span>
        </div>
        <div class="view-bar" id="view-bar-content">
            <div class="log-entry log-info">[SYSTEM] Initializing King of AI Workspace...</div>
            <div class="log-entry log-info">[SYSTEM] GitHub Pages deployment detected. Waiting for action...</div>
        </div>
    </div>

    <script>
        // DOM Elements
        const promptInput = document.getElementById('prompt');
        const viewBar = document.getElementById('view-bar-content');
        const statusBadge = document.getElementById('system-status');

        // Function to log actions in View Bar
        function logToViewBar(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const logElement = document.createElement('div');
            logElement.className = `log-entry log-${type}`;
            logElement.innerText = `[${time}] ${message}`;
            viewBar.appendChild(logElement);
            viewBar.scrollTop = viewBar.scrollHeight;
        }

        // 1. Generate Code Button Event
        document.getElementById('btn-generate-code').addEventListener('click', () => {
            const text = promptInput.value.trim();
            if (!text) {
                logToViewBar("براہ کرم پہلے کچھ پرامپٹ لکھیں!", "warning");
                return;
            }
            statusBadge.innerText = "Generating Code...";
            logToViewBar(`Processing Command: "${text}"`, "info");
            
            setTimeout(() => {
                logToViewBar("Code generation completed successfully!", "success");
                logToViewBar("Generated Sample Code Structure for Android/Web.", "info");
                statusBadge.innerText = "System Ready";
            }, 1000);
        });

        // 2. Voice Generation Button Event
        document.getElementById('btn-generate-voice').addEventListener('click', () => {
            const text = promptInput.value.trim();
            if (!text) {
                logToViewBar("وائس جنریٹ کرنے کے لیے ٹیکسٹ درج کریں!", "warning");
                return;
            }
            statusBadge.innerText = "Generating Voice...";
            logToViewBar("Converting Text to Speech Audio File...", "info");
            
            setTimeout(() => {
                logToViewBar("Voice File Generated: output_audio.mp3", "success");
                statusBadge.innerText = "System Ready";
            }, 1200);
        });

        // 3. Build APK Button Event
        document.getElementById('btn-build-apk').addEventListener('click', () => {
            const text = promptInput.value.trim();
            if (!text) {
                logToViewBar("APK بنانے کے لیے ایپ کی تفصیلات درج کریں!", "warning");
                return;
            }
            statusBadge.innerText = "Building APK...";
            logToViewBar("Triggering Automated Build Pipeline...", "info");
            logToViewBar("Compiling Flutter/Android Native source code...", "warning");

            setTimeout(() => {
                logToViewBar("SUCCESS: APK Generated Successfully -> app-release.apk", "success");
                statusBadge.innerText = "System Ready";
            }, 2000);
        });
    </script>
</body>
</html>
