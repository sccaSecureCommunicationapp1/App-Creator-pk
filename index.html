<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King of AI Studio & APK Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Side Controls Panel */
        .sidebar {
            width: 350px;
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid #334155;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
        }

        .sidebar h2 {
            color: #38bdf8;
            font-size: 1.25rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        textarea {
            width: 100%;
            height: 130px;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            resize: none;
            font-size: 0.95rem;
        }

        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button.voice-btn {
            background-color: #9333ea;
        }

        button.voice-btn:hover {
            background-color: #7e22ce;
        }

        button.apk-btn {
            background-color: #16a34a;
        }

        button.apk-btn:hover {
            background-color: #15803d;
        }

        /* Main View Bar Window */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #020617;
        }

        .header {
            background-color: #0f172a;
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background-color: #1e293b;
            color: #4ade80;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid #22c55e;
            font-weight: 600;
        }

        .view-bar {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
        }

        .log-success { border-left-color: #22c55e; color: #4ade80; }
        .log-warning { border-left-color: #eab308; color: #fde047; }
        .log-info { border-left-color: #38bdf8; color: #7dd3fc; }
    </style>
</head>
<body>

    <!-- Sidebar Control Panel -->
    <div class="sidebar">
        <h2>King of AI Studio</h2>
        <label for="prompt">کمانڈ یا پرامپٹ درج کریں:</label>
        <textarea id="prompt" placeholder="مثال: ایک جدید کیلکولیٹر ایپ جنریٹ کرو..."></textarea>
        
        <div class="btn-group">
            <button id="btn-generate-code">⚡ جنریٹ کوڈ (Generate Code)</button>
            <button id="btn-generate-voice" class="voice-btn">🎙️ جنریٹ وائس (Generate Voice)</button>
            <button id="btn-build-apk" class="apk-btn">📦 بلڈ اور جنریٹ APK (Build APK)</button>
        </div>
    </div>

    <!-- Main Terminal View -->
    <div class="main-content">
        <div class="header">
            <h3>سسٹم سٹیٹس اور لائیو آؤٹ پٹ (View Bar)</h3>
            <span id="system-status" class="status-badge">System Ready</span>
        </div>
        
        <div id="view-bar-content" class="view-bar">
            <div class="log-entry log-info">[SYSTEM]: King of AI Engine 1.0 کامیابی سے لوڈ ہو چکا ہے۔</div>
            <div class="log-entry log-success">[READY]: آپ کا ڈیش بورڈ تیار ہے۔ کمانڈ ٹائپ کر کے بٹن پر کلک کریں۔</div>
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('prompt');
        const viewBar = document.getElementById('view-bar-content');
        const statusBadge = document.getElementById('system-status');

        function logToViewBar(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const logElement = document.createElement('div');
            logElement.className = `log-entry log-${type}`;
            logElement.innerText = `[${time}] ${message}`;
            viewBar.appendChild(logElement);
            viewBar.scrollTop = viewBar.scrollHeight;
        }

        document.getElementById('btn-generate-code').addEventListener('click', () => {
            const text = promptInput.value.trim();
            if (!text) return logToViewBar("براہ کرم پہلے کوئی کمانڈ لکھیں!", "warning");
            statusBadge.innerText = "Generating Code...";
            logToViewBar(`پرامپٹ پروسیس ہو رہا ہے: "${text}"`, "info");
            setTimeout(() => {
                logToViewBar("ایپ کا بنیادی کوڈ جنریٹ ہو گیا ہے!", "success");
                statusBadge.innerText = "System Ready";
            }, 1000);
        });

        document.getElementById('btn-generate-voice').addEventListener('click', () => {
            const text = promptInput.value.trim();
            if (!text) return logToViewBar("وائس جنریٹ کرنے کے لیے ٹیکسٹ لکھیں!", "warning");
            statusBadge.innerText = "Generating Voice...";
            logToViewBar("ٹیکسٹ سے آڈیو فائل تیار کی جا رہی ہے...", "info");
            setTimeout(() => {
                logToViewBar("SUCCESS: وائس فائل تیار ہو گئی ہے (voice_output.mp3)", "success");
                statusBadge.innerText = "System Ready";
            }, 1200);
        });

        document.getElementById('btn-build-apk').addEventListener('click', () => {
            const text = promptInput.value.trim();
            if (!text) return logToViewBar("APK بنانے کے لیے ہدایات درج کریں!", "warning");
            statusBadge.innerText = "Building APK...";
            logToViewBar("GitHub Actions Workflow کو سگنل بھیجا جا رہا ہے...", "info");
            logToViewBar("Compiling Android Native code on Cloud Server...", "warning");
            setTimeout(() => {
                logToViewBar("SUCCESS: APK جنریٹ ہو چکی ہے! (app-release.apk)", "success");
                statusBadge.innerText = "System Ready";
            }, 2500);
        });
    </script>
</body>
</html>
