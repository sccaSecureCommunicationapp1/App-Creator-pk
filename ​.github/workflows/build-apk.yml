name: Build Real Android APK

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [build_apk_event]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Auto-Create Android Project Structure
        run: |
          echo "Initializing Flutter Android environment and generating all required folders..."
          flutter create . --force --org com.kingofai

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Build Standalone Release APK
        run: flutter build apk --release

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingOfAI-Generated-App
          path: build/app/outputs/flutter-apk/app-release.apk
